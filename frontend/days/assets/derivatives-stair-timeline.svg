<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="900" viewBox="0 0 1536 900" role="img" aria-labelledby="title desc">
  <title id="title">선물과 옵션의 계단형 학습 흐름</title>
  <desc id="desc">파생상품의 탄생부터 투자 전 필수 관문까지 여섯 단계를 왼쪽 위에서 오른쪽 아래로 이어지는 계단형 타임라인으로 보여 줍니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f9ff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17315f" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1l9 5-9 5z" fill="#78a2dc"/></marker>
    <style>
      .title{font:800 43px 'Noto Sans KR',Arial,sans-serif;fill:#0b2454}.kicker{font:700 18px 'Noto Sans KR',Arial,sans-serif;letter-spacing:2px;fill:#2563eb}.num{font:800 22px Arial,sans-serif;fill:#fff}.step{font:800 25px 'Noto Sans KR',Arial,sans-serif;fill:#102347}.body{font:500 17px 'Noto Sans KR',Arial,sans-serif;fill:#405271}.tag{font:700 15px 'Noto Sans KR',Arial,sans-serif;fill:#fff}.foot{font:500 15px 'Noto Sans KR',Arial,sans-serif;fill:#526583}
    </style>
  </defs>
  <rect width="1536" height="900" fill="url(#bg)"/>
  <path d="M62 181H1450" stroke="#d5e4fa" stroke-width="2" stroke-dasharray="7 10"/>
  <text x="64" y="72" class="kicker">DERIVATIVES · LEARNING FLOW</text>
  <text x="64" y="124" class="title">선물과 옵션, 왼쪽 위에서 오른쪽 아래로 이해하기</text>
  <text x="64" y="157" class="foot">각 단계를 차례로 따라가며 계약 구조와 위험 관리의 흐름을 살펴보세요.</text>

  <path d="M300 298 L353 328" fill="none" stroke="#78a2dc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M550 423 L603 453" fill="none" stroke="#78a2dc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M800 548 L853 578" fill="none" stroke="#78a2dc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1050 673 L1103 703" fill="none" stroke="#e69a9a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M1300 798 L1353 828" fill="none" stroke="#78a2dc" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(60 195)" filter="url(#shadow)">
    <rect width="240" height="104" rx="20" fill="#fff" stroke="#2f7ec4" stroke-width="4"/>
    <circle cx="31" cy="31" r="20" fill="#2f7ec4"/><text x="24" y="39" class="num">1</text>
    <text x="62" y="39" class="step">파생상품의 탄생</text><text x="22" y="73" class="body">쌀·주식·금 같은</text><text x="22" y="94" class="body">기초자산에서 가치가 파생</text>
  </g>
  <g transform="translate(310 320)" filter="url(#shadow)">
    <rect width="240" height="104" rx="20" fill="#fff" stroke="#2f7ec4" stroke-width="4"/>
    <circle cx="31" cy="31" r="20" fill="#2f7ec4"/><text x="24" y="39" class="num">2</text>
    <text x="62" y="39" class="step">선물 Futures</text><text x="22" y="73" class="body">미래의 가격을 미리 정한</text><text x="22" y="94" class="body">반드시 이행할 약속</text>
  </g>
  <g transform="translate(560 445)" filter="url(#shadow)">
    <rect width="240" height="104" rx="20" fill="#fff" stroke="#2f7ec4" stroke-width="4"/>
    <circle cx="31" cy="31" r="20" fill="#2f7ec4"/><text x="24" y="39" class="num">3</text>
    <text x="62" y="39" class="step">옵션 Options</text><text x="22" y="73" class="body">유리할 때에만 선택해서</text><text x="22" y="94" class="body">행사할 수 있는 권리</text>
  </g>
  <g transform="translate(810 570)" filter="url(#shadow)">
    <rect width="240" height="104" rx="20" fill="#fff8f7" stroke="#dc5656" stroke-width="4"/>
    <circle cx="31" cy="31" r="20" fill="#dc5656"/><text x="24" y="39" class="num">4</text>
    <text x="62" y="39" class="step">레버리지의 위험</text><text x="22" y="73" class="body">작은 증거금으로 큰 거래,</text><text x="22" y="94" class="body">손실도 빠르게 커질 수 있음</text>
  </g>
  <g transform="translate(1060 695)" filter="url(#shadow)">
    <rect width="240" height="104" rx="20" fill="#fff8f7" stroke="#dc5656" stroke-width="4"/>
    <circle cx="31" cy="31" r="20" fill="#dc5656"/><text x="24" y="39" class="num">5</text>
    <text x="62" y="39" class="step">개인 투자자의 현실</text><text x="22" y="73" class="body">예측이 빗나갈 때의 손실과</text><text x="22" y="94" class="body">감당 범위를 먼저 확인</text>
  </g>
  <g transform="translate(1310 820)" filter="url(#shadow)">
    <rect width="190" height="72" rx="20" fill="#f4f8ff" stroke="#2f7ec4" stroke-width="4"/>
    <circle cx="29" cy="29" r="19" fill="#2f7ec4"/><text x="22" y="37" class="num">6</text>
    <text x="58" y="31" class="step" style="font-size:19px">투자 전 필수 관문</text><text x="18" y="56" class="body" style="font-size:14px">교육·모의거래·위험 점검</text>
  </g>
</svg>
