name: CD — Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: domain-rag-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync and deploy production stack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for name in EC2_SSH_PRIVATE_KEY EC2_HOST; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/domain-rag-deploy.pem
          chmod 600 ~/.ssh/domain-rag-deploy.pem
          ssh-keygen -y -f ~/.ssh/domain-rag-deploy.pem >/dev/null
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Cannot retrieve EC2 SSH host key. Check EC2_HOST, instance status, and inbound TCP 22 access from GitHub runners."
            exit 1
          fi

      - name: Synchronize application files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.git' \
            --exclude '.claude' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.pem' \
            --exclude 'data/lean-workflows' \
            --filter 'protect data/' \
            -e 'ssh -i ~/.ssh/domain-rag-deploy.pem' \
            ./ "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/"

      - name: Build and restart services
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ~/.ssh/domain-rag-deploy.pem "$EC2_USER@$EC2_HOST" <<EOF
          set -euo pipefail
          cd "$EC2_APP_DIR"
          if [ ! -f .env.prod ]; then
            echo "ERROR: $EC2_APP_DIR/.env.prod is missing. Restore the production environment file on EC2 before deploying." >&2
            exit 1
          fi
          # pr.edumgt.co.kr 은 fd.edumgt.co.kr(lumina-invest)과 같은 EC2 에서 기존 Caddy 뒤에 붙는다(deploy/pr-edumgt/README.md).
          # docker-compose.prod.yml 은 자체 Caddy 가 80/443 을 열어 충돌하므로 쓰지 않는다.
          sudo docker network inspect shared-net >/dev/null 2>&1 || sudo docker network create shared-net
          sudo docker compose -f deploy/pr-edumgt/compose.yml up --build -d
          sudo docker compose -f deploy/pr-edumgt/compose.yml ps
          sudo docker compose -f deploy/pr-edumgt/compose.yml exec -T api curl --fail --retry 12 --retry-delay 5 http://localhost:8000/health
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/domain-rag-deploy.pem
